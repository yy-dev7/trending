        <span style="font-weight:700">源流 / Liú</span>

          <a class="go" data-latest="trending" href="reports/2026-06-19.html">阅读今日 →</a>
          <a class="ghost" href="reports/index.html">全部归档</a>
        </div>
      </div>
      <div class="card">

        <h2>行业动态</h2>
        <p>来自一线实验室与科技媒体的官方信源，精选当日动向并附原文链接。</p>
        <div class="card-actions">
          <a class="go" data-latest="news" href="news/2026-06-19.html">阅读今日 →</a>
          <a class="ghost" href="news/index.html">全部归档</a>

    <footer class="foot">
      <span>源流 · 由 Claude routines 自动维护</span>
      <span><a href="https://github.com/yy-dev7/trending">GitHub 仓库</a></span>
